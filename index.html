<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💗</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141e30,#243b55);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;
    color:white;
}

.container{
    width:90%;
    max-width:600px;
}

.window{
    background:rgba(20,20,30,0.95);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.1);
}

.topbar{
    height:42px;
    background:#252532;
    display:flex;
    align-items:center;
    padding:0 15px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    margin-right:8px;
}

.red{background:#ff5f57;}
.yellow{background:#febc2e;}
.green{background:#28c840;}

.title{
    margin-left:10px;
    color:#aaa;
    font-size:13px;
}

.content{
    padding:40px 25px;
    text-align:center;
}

.code{
    color:#7ee787;
    font-family:monospace;
    margin-bottom:20px;
    line-height:1.6;
}

h1{
    font-size:35px;
    margin-bottom:15px;
}

p{
    color:#ddd;
    line-height:1.8;
}

button{
    margin-top:30px;
    padding:14px 28px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,#ff6b9d,#ff4f81);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:active{
    transform:scale(0.95);
}

#card{
    display:none;
}

.emoji{
    font-size:55px;
    margin-bottom:15px;
}

.signature{
    margin-top:25px;
    color:#ff9fbd;
    font-style:italic;
}

.status{
    margin-top:20px;
    color:#7ee787;
    font-family:monospace;
}

.cursor{
    display:inline-block;
    width:2px;
    height:18px;
    background:#ff9fbd;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

.heart{
    position:fixed;
    bottom:-30px;
    pointer-events:none;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    from{
        transform:translateY(0);
        opacity:0;
    }
    20%{
        opacity:0.8;
    }
    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

@media(max-width:500px){
    h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="window">

        <div class="topbar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <div class="title">special_message.exe</div>
        </div>

        <div class="content" id="opening">

            <div class="code">
                > Initializing special message...<br>
                > Checking recipient...<br>
                > Recipient found ✓
            </div>

            <div class="emoji">💌</div>

            <h1>Hey, you...</h1>

            <p>There's a little message waiting for you.</p>

            <button id="openBtn">OPEN MESSAGE 💗</button>

        </div>

        <div class="content" id="card">

            <div class="emoji">🌷</div>

            <h1>Get Well Soon!!</h1>

            <p id="typing"></p>

            <div class="signature">
                — From someone who wish you for a speedy recovery 🤍
            </div>

            <div class="status">
                Status: GET WELL SOON ❤️
            </div>

        </div>

    </div>
</div>

<script>

const message =
"I hope you feel better soon. Take plenty of rest and take care of yourself, okay? Don't forget to get some good rest.🤍";

let typed = false;

document.getElementById("openBtn").addEventListener("click", function(){

    document.getElementById("opening").style.display="none";
    document.getElementById("card").style.display="block";

    if(!typed){
        typeMessage();
        typed = true;
    }
});

function typeMessage(){

    let i=0;
    const text=document.getElementById("typing");

    function typing(){
        if(i<message.length){
            text.textContent += message.charAt(i);
            i++;
            setTimeout(typing,45);
        }
    }

    typing();
}

function createHeart(){

    const heart=document.createElement("div");
    heart.className="heart";

    const symbols=["🤍","💗","🌷","✨"];
    heart.innerHTML=symbols[Math.floor(Math.random()*symbols.length)];

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*15)+"px";
    heart.style.animationDuration=(5+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);
}

setInterval(createHeart,900);

</script>

</body>
</html>
